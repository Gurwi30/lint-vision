name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.1

      - name: Read version from tag
        run: echo "PLUGIN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build change notes from commits
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}${GITHUB_REF_NAME}"
          {
            echo "CHANGE_NOTES<<EOF"
            echo "<ul>"
            git log "$RANGE" --no-merges --pretty=format:'<li>%s</li>'
            echo
            echo "</ul>"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Sign and publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: gradle publishPlugin -PpluginVersion="$PLUGIN_VERSION"

      - name: Extract plugin JAR
        shell: bash
        run: |
          mkdir -p release
          shopt -s nullglob
          archives=(build/distributions/*-signed.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No signed plugin ZIP found."
            exit 1
          fi
          for archive in "${archives[@]}"; do
            unzip -j "$archive" '*.jar' -d release
          done
          if ! compgen -G "release/*.jar" > /dev/null; then
            echo "No plugin JAR found inside signed ZIP."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}